name: GRASP CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          pip install pytest httpx
          pip install -r apps/api/requirements.txt
          
      - name: Run Backend Tests
        run: |
          pytest apps/api/tests/ packages/pipeline/tests/ packages/agents/tests/ packages/sdk/tests/
          
      - name: Run Frontend Tests
        working-directory: ./apps/web
        run: |
          npm ci
          # npm test  # Uncomment when jest/vitest is configured

  build-api:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Auth Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          
      - name: Set up GCLOUD
        uses: google-github-actions/setup-gcloud@v2
        
      - name: Build and Push Docker
        run: |
          gcloud auth configure-docker gcr.io
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/grasp-api:latest -f docker/api.Dockerfile .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/grasp-api:latest

  deploy-api:
    needs: [build-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auth Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy grasp-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/grasp-api:latest \
            --region us-central1 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 30s \
            --set-secrets ANTHROPIC_API_KEY=anthropic-key:latest,DATABASE_URL=db-url:latest,REDIS_URL=redis-url:latest,SUPABASE_SERVICE_KEY=supabase-key:latest,STRIPE_SECRET_KEY=stripe-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook:latest

  deploy-modal:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deploy Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install modal
          modal deploy apps/worker/inference.py

  deploy-web:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web

  notify:
    needs: [deploy-api, deploy-modal, deploy-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
